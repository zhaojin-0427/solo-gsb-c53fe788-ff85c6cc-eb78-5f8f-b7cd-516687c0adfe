services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://gateway:gateway@db:5432/gateway
      # Override in real deployments, e.g. via .env or secrets:
      #   MASKING_HMAC_KEY=<random 32+ byte secret>
      MASKING_HMAC_KEY: ${MASKING_HMAC_KEY:-dev-only-insecure-key-change-me}
      IDEMPOTENCY_LOCK_TIMEOUT_MS: "15000"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
